version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; upgrade once it supports 7
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # SheetJS is pinned in vendor/ on purpose (ADR 0008); the npm copy is out of date
      - dependency-name: xlsx

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
