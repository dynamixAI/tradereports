name: CI

on:
  pull_request:
  push:
    branches: [main]

# least privilege: the workflow can only read the code
permissions:
  contents: read

# cancel older runs on the same branch when new commits arrive
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly what package-lock.json says
      - name: Install dependencies
        run: npm ci

      - name: Format, lint, types and tests
        run: npm run check

      - name: Audit production dependencies
        run: npm run audit:prod
