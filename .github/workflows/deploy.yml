name: Deploy site

on:
  push:
    branches: [main]
  # lets you re-run a deploy by hand from the Actions tab
  workflow_dispatch:
  # rebuild every morning so guides with a publish date go live on that day
  # (05:17 UTC is 05:17 in winter and 06:17 in summer, UK time)
  schedule:
    - cron: '17 5 * * *'

# by default the workflow can only read the code
permissions:
  contents: read

# one deploy at a time; never cancel one halfway through
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # same checks as CI, so a broken build never goes live
      - name: Format, lint, types, tests and build
        run: npm run check

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # only this job may publish to Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
